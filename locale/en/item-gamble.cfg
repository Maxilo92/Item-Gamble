[mod-name]
item-gamble=Item Gamble

[mod-description]
item-gamble=Exchange items for coins, bet them on a target and let the wheel of fortune decide.

[mod-setting-name]
item-gamble-exchange-rate=Exchange rate
item-gamble-max-chance=Maximum win chance
item-gamble-stake-value-factor=Stake value factor
item-gamble-min-chance=Minimum win chance
item-gamble-quality-multiplier=Value factor per quality level
item-gamble-consolation-chance=Consolation prize share on the wheel
item-gamble-progression-weight=Value factor for game progress
item-gamble-freespin-chance=Free spin chance on a miss
item-gamble-jackpot-share=Jackpot share

[mod-setting-description]
item-gamble-exchange-rate=Coins per value unit when exchanging. At 0.45 items bring 45 % of their value as coins. There is no way back. Together with the best chance of 50 % at the table, free spins and consolation prizes, on average about a quarter of the exchanged value comes back.
item-gamble-max-chance=Chance = maximum × stake value factor × stake ÷ target value, one coin counts as one value unit. The more valuable the target, the lower the chance. With 1 and a stake value factor of 0.5, staking the full target value is at 50 %.
item-gamble-stake-value-factor=For the chance, the stake only counts with this share, like buying and selling prices. You cannot stake more than the target is worth. At 0.5 and a maximum of 1 the chance is at most 50 %, on average the table returns half of the staked coins as items. 1 switches it off.
item-gamble-min-chance=Lowest allowed win chance. 0.000005 equals 1 in 200,000.
item-gamble-quality-multiplier=The item value is multiplied by this factor per quality level. Legendary is level 5.
item-gamble-progression-weight=Later items are worth more. Value × (1 + weight × log10(1 + research time / 1000 s)), counting all research up to the recipe and its building. At 1.5: blue science ×3, planet science packs ×4.6, promethium ×5.6. 0 turns it off.
item-gamble-consolation-chance=Share of the losing fields that carry a consolation prize of a tenth or a hundredth of the stake in coins. If the wheel stops on one, it goes to your account despite the miss. 0 turns consolation prizes off.
item-gamble-freespin-chance=How likely a miss gives a free spin. A free spin plays exactly the bet it was won with, including its multiplier, for free. At most 0.25, so you still lose on average with free spins. 0 turns free spins off.
item-gamble-jackpot-share=This share of every paid stake goes into the shared jackpot. Every paid spin can hit it (about 20 % per million coins staked, at most 1 % per spin). Afterwards the pot starts again at 10,000 coins. 0 turns the jackpot off.

