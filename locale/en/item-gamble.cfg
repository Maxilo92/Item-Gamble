[mod-name]
item-gamble=Item Gamble

[mod-description]
item-gamble=Stake an item, pick a target and let the wheel of fortune decide.

[mod-setting-name]
item-gamble-max-chance=Maximum win chance
item-gamble-stake-value-factor=Stake value factor
item-gamble-min-chance=Minimum win chance
item-gamble-quality-multiplier=Value factor per quality level
item-gamble-consolation-chance=Consolation prize share on the wheel
item-gamble-progression-weight=Value factor for game progress

[mod-setting-description]
item-gamble-max-chance=Chance = maximum × stake value factor ÷ value ratio. The more valuable the target, the lower the chance.
item-gamble-stake-value-factor=For the chance, the stake only counts with this share of its value, like buying and selling prices. The target still has to be worth more than the full stake. At 0.5 and a maximum of 0.75 the chance is at most 37.5 %, on average you get 37.5 % of the stake value back. 1 switches it off.
item-gamble-min-chance=Lowest allowed win chance. 0.00001 equals 1 in 100,000.
item-gamble-quality-multiplier=The item value is multiplied by this factor per quality level. Legendary is level 5.
item-gamble-progression-weight=Later items are worth more. Value × (1 + weight × log10(1 + research time / 1000 s)), counting all research up to the recipe and its building. At 1.5: blue science ×3, planet science packs ×4.6, promethium ×5.6. 0 turns it off.
item-gamble-consolation-chance=Share of the losing fields that carry a consolation prize worth about a tenth or a hundredth of the stake. If the wheel stops on one you get it despite the miss. 0 turns consolation prizes off.

