[mod-name]
item-gamble=Item Gamble

[mod-description]
item-gamble=Setze ein Item ein, wähle ein Ziel und lass das Glücksrad entscheiden.

[mod-setting-name]
item-gamble-max-chance=Maximale Gewinnchance
item-gamble-min-chance=Minimale Gewinnchance
item-gamble-quality-multiplier=Wertfaktor pro Qualitätsstufe
item-gamble-progression-weight=Wertfaktor für Spielfortschritt
item-gamble-consolation-chance=Trostpreis-Anteil auf der Walze

[mod-setting-description]
item-gamble-max-chance=Chance bei gleichem Wert von Einsatz und Ziel. Je teurer das Ziel, desto kleiner die Chance (Maximum geteilt durch Wertverhältnis). 0,75 heißt: Im Schnitt verliert man 25 % vom Einsatzwert.
item-gamble-min-chance=Kleinste erlaubte Gewinnchance. 0,00001 entspricht 1 zu 100.000.
item-gamble-quality-multiplier=Der Itemwert wird pro Qualitätsstufe mit diesem Faktor multipliziert. Legendär ist Stufe 5.
item-gamble-progression-weight=Spätere Items sind mehr wert. Wert × (1 + Gewicht × log10(1 + Forschungszeit / 1000 s)), gezählt wird alle Forschung bis zum Rezept und seinem Gebäude. Bei 1,5: blaue Wissenschaft ×3, Planeten-Wissenschaften ×4,6, Promethium ×5,6. 0 schaltet es ab.
item-gamble-consolation-chance=Auf diesem Anteil der Nieten-Felder liegt ein Trostpreis im Wert von etwa einem Zehntel oder Hundertstel des Einsatzes. Landet die Walze darauf, bekommst du ihn trotz Niete. 0 schaltet Trostpreise ab.

