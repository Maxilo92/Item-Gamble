[mod-name]
item-gamble=Item Gamble

[mod-description]
item-gamble=Wechsle Items in Coins, setze sie auf ein Ziel und lass das Glücksrad entscheiden.

[mod-setting-name]
item-gamble-exchange-rate=Wechselkurs
item-gamble-max-chance=Maximale Gewinnchance
item-gamble-stake-value-factor=Einsatz-Wertfaktor
item-gamble-min-chance=Minimale Gewinnchance
item-gamble-quality-multiplier=Wertfaktor pro Qualitätsstufe
item-gamble-progression-weight=Wertfaktor für Spielfortschritt
item-gamble-consolation-chance=Trostpreis-Anteil auf der Walze
item-gamble-freespin-chance=Freispin-Chance bei einer Niete

[mod-setting-description]
item-gamble-exchange-rate=Coins pro Werteinheit beim Einwechseln. Bei 0,45 bringen Items 45 % ihres Werts als Coins. Zurücktauschen geht nicht. Zusammen mit der höchsten Chance von 50 % am Tisch, Freispins und Trostpreisen kommt im Schnitt etwa ein Viertel des eingewechselten Werts zurück.
item-gamble-max-chance=Chance = Maximum × Einsatz-Wertfaktor × Einsatz ÷ Zielwert, ein Coin zählt dabei so viel wie eine Werteinheit. Je teurer das Ziel, desto kleiner die Chance. Mit 1 und Wertfaktor 0,5 liegt ein Einsatz in Höhe des Zielwerts bei 50 %.
item-gamble-stake-value-factor=Für die Chance zählt der Einsatz nur mit diesem Anteil, wie An- und Verkaufspreis. Mehr als den Zielwert kann man nicht setzen. Bei 0,5 und Maximum 1 liegt die Chance höchstens bei 50 %, im Schnitt bekommt man am Tisch die Hälfte der gesetzten Coins als Items zurück. 1 schaltet es ab.
item-gamble-min-chance=Kleinste erlaubte Gewinnchance. 0,000005 entspricht 1 zu 200.000.
item-gamble-quality-multiplier=Der Itemwert wird pro Qualitätsstufe mit diesem Faktor multipliziert. Legendär ist Stufe 5.
item-gamble-progression-weight=Spätere Items sind mehr wert. Wert × (1 + Gewicht × log10(1 + Forschungszeit / 1000 s)), gezählt wird alle Forschung bis zum Rezept und seinem Gebäude. Bei 1,5: blaue Wissenschaft ×3, Planeten-Wissenschaften ×4,6, Promethium ×5,6. 0 schaltet es ab.
item-gamble-consolation-chance=Auf diesem Anteil der Nieten-Felder liegt ein Trostpreis von einem Zehntel oder Hundertstel des Einsatzes in Coins. Landet die Walze darauf, bekommst du ihn trotz Niete aufs Konto. 0 schaltet Trostpreise ab.
item-gamble-freespin-chance=So wahrscheinlich bringt eine Niete einen Freispin. Ein Freispin spielt kostenlos genau die Wette, mit der er gewonnen wurde, auch mit ihrem Multiplikator. Höchstens 0,25, damit man auch mit Freispins im Schnitt verliert. 0 schaltet Freispins ab.

